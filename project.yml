# XcodeGen project definition for the Heartelfie iOS app.
#
# The library layer lives in the local Swift package (./Package.swift). This file
# describes the thin `Heartelfie` app target that hosts it. Generate the Xcode
# project on a Mac with:
#
#     brew install xcodegen   # once
#     xcodegen generate
#     open Heartelfie.xcodeproj
#
# (You can also just open Package.swift directly in Xcode to build/test the
# library modules and run the DSP unit tests, without generating the app project.)

name: DailyDil
options:
  bundleIdPrefix: com.heartelfie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Heartelfie:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: J2P293N3N8
    CODE_SIGN_STYLE: Automatic

schemes:
  DailyDil:
    build:
      targets:
        DailyDil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Heartelfie/HECoreTests
        - package: Heartelfie/HESignalTests
        - DailyDilUITests
    archive:
      config: Release

targets:
  DailyDil:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Heartelfie
    dependencies:
      - package: Heartelfie
        product: HEFeatures
    entitlements:
      path: App/Heartelfie/Heartelfie.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartelfie.ios
        PRODUCT_NAME: DailyDil
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_FILE: App/Heartelfie/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"

  DailyDilUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/DailyDilUITests
    dependencies:
      - target: DailyDil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartelfie.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: DailyDil
