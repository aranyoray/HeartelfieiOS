# XcodeGen project definition for the Heartelfie iOS app.
#
# The library layer lives in the local Swift package (./Package.swift). This file
# describes the thin `Heartelfie` app target that hosts it. Generate the Xcode
# project on a Mac with:
#
#     brew install xcodegen   # once
#     xcodegen generate
#     open Heartelfie.xcodeproj
#
# (You can also just open Package.swift directly in Xcode to build/test the
# library modules and run the DSP unit tests, without generating the app project.)

name: Heartelfie
options:
  bundleIdPrefix: com.heartelfie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Heartelfie:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "" # set your team for device builds
    CODE_SIGN_STYLE: Automatic

schemes:
  Heartelfie:
    build:
      targets:
        Heartelfie: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Heartelfie/HECoreTests
        - package: Heartelfie/HESignalTests
    archive:
      config: Release

targets:
  Heartelfie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Heartelfie
    dependencies:
      - package: Heartelfie
        product: HEFeatures
    entitlements:
      path: App/Heartelfie/Heartelfie.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartelfie.app
        PRODUCT_NAME: Heartelfie
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: App/Heartelfie/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
