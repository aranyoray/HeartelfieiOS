# XcodeGen project definition for the DailyDil iOS app.
#
# The library layer lives in the local Swift package (./Package.swift). This file
# describes the thin DailyDil app target that hosts it. Generate the Xcode
# project on a Mac with:
#
#     brew install xcodegen   # once
#     xcodegen generate
#     open DailyDil.xcodeproj
#
# (You can also just open Package.swift directly in Xcode to build/test the
# library modules and run the DSP unit tests, without generating the app project.)

name: DailyDil
options:
  # Explicit bundle IDs below stay on the original App Store record.
  bundleIdPrefix: com.heartelfie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DailyDil:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: J2P293N3N8
    CODE_SIGN_STYLE: Automatic

schemes:
  DailyDil:
    build:
      targets:
        DailyDil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: DailyDil/HECoreTests
        - package: DailyDil/HESignalTests
        - DailyDilUITests
    archive:
      config: Release

targets:
  DailyDil:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/DailyDil
    dependencies:
      - package: DailyDil
        product: HEFeatures
      - target: DailyDilWidget
    entitlements:
      path: App/DailyDil/DailyDil.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.heartelfie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartelfie.ios
        PRODUCT_NAME: DailyDil
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "17"
        INFOPLIST_FILE: App/DailyDil/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"

  DailyDilWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/DailyDilWidget
    entitlements:
      path: App/DailyDilWidget/DailyDilWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heartelfie.ios
    info:
      path: App/DailyDilWidget/Info.plist
      properties:
        CFBundleDisplayName: DailyDil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartelfie.ios.widget
        PRODUCT_NAME: DailyDilWidget
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "17"
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"

  DailyDilUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/DailyDilUITests
    dependencies:
      - target: DailyDil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartelfie.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: DailyDil
